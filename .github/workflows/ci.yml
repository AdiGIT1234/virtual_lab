name: CI

on:
  push:
    branches: [main]

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (must be zero errors)
        working-directory: frontend
        run: npm run build

  backend-lint:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check syntax (pyflakes)
        working-directory: backend
        run: |
          pip install pyflakes
          python -m pyflakes main.py engine/ rag/ services/ || true

      - name: Verify app imports cleanly
        working-directory: backend
        run: python -c "import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.').rglob('*.py') if 'venv' not in str(p)]"
