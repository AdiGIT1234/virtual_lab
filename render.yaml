services:
  - type: web
    name: virtual-lab-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: "" # Required — set on Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: "" # Required — set on Render Dashboard
      - key: SUPABASE_ANON_KEY
        value: "" # Required — set on Render Dashboard
      - key: GROQ_API_KEY
        value: "" # Required — set on Render Dashboard
      - key: ADMIN_EMAILS
        value: "" # Required — comma-separated admin emails
      - key: FRONTEND_ORIGINS
        value: "" # Required — comma-separated allowed frontend URLs
      - key: ENV
        value: "production"
