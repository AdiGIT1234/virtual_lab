services:
  - type: web
    name: virtual-lab-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: "" # Fill this in on the Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: "" # Fill this in on the Render Dashboard
      - key: PYTHON_VERSION
        value: 3.11.0 # Standardize Python version on the server
