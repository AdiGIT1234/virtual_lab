services:
  - type: web
    name: virtual-lab-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: apt-get update -qq && apt-get install -y --no-install-recommends avr-gcc avr-libc binutils-avr && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ENV
        value: "production"
